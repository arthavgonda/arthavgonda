<svg xmlns="http://www.w3.org/2000/svg" width="900" height="148" viewBox="0 0 900 148" role="img" aria-label="SETU, a local-first voice assistant written in Rust">
<title>SETU, a local-first voice assistant written in Rust</title>
<style>
  .rule { transform-box: fill-box; transform-origin: left; transform: scaleX(0);
          animation: rule 1.2s cubic-bezier(.65,0,.35,1) .1s forwards; }
  @keyframes rule { to { transform: scaleX(1); } }
  .fade { opacity: 0; transform: translateY(6px); animation: fade .7s ease-out forwards; }
  @keyframes fade { to { opacity: 1; transform: none; } }
  .bar { transform-box: fill-box; transform-origin: center; animation: talk 1.2s ease-in-out infinite alternate; }
  @keyframes talk { from { transform: scaleY(.22); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .rule { transform: none !important; }
    .fade { opacity: 1 !important; transform: none !important; }
  }
</style>
